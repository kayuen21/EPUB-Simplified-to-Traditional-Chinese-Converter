[converter]
# 轉換模式 (Mode):
#   s2t   - 簡體到繁體 (OpenCC 標準，預設，精確轉換文字不改動原作用詞)
#   s2tw  - 簡體到臺灣繁體 (字形符合臺灣標準)
#   s2twp - 簡體到臺灣繁體 (含臺灣慣用詞彙轉換，如 鼠標->滑鼠, 軟件->軟體)
#   s2hk  - 簡體到香港繁體 (字形符合香港標準)
mode = s2t

# 引號轉換 (Quote Conversion):
#   true  - 自動將雙引號 “” 轉為「」、單引號 ‘’ 轉為『』（預設開啟）
#   false - 保留原始彎引號
convert_quotes = true

# 當檔案名稱不含簡體字時（如英文檔名或已是繁體），在檔名末尾附加的後綴
suffix = (繁體)

# EPUB 語言標籤 (將 zh-CN / zh-Hans 更新為此標籤，讓閱讀器套用繁體字型排版)
target_lang = zh-TW
